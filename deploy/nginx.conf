# Static hosting for the release build of Tesla Wrap Studio.
#
# The app is a single page Flutter bundle: every unknown path belongs to
# index.html, and the hashed assets can be cached forever.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Self hosted deployments do not need to leak the nginx version.
    server_tokens off;
    charset utf-8;

    # Tesla templates and example wraps are large PNGs; the generated wrap is
    # downloaded from the browser, never uploaded to this server.
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/wasm image/svg+xml
                      application/x-javascript;

    # The engine, the fonts and the wrap art never change between builds and
    # are by far the heaviest part of the bundle.
    location ~ ^/canvaskit/ {
        expires 365d;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|webp|svg|otf|ttf|woff2?)$ {
        expires 365d;
        access_log off;
        try_files $uri =404;
    }

    # `main.dart.js` and `flutter_bootstrap.js` keep their names across
    # releases, so caching them for a year would pin users to an old build.
    location ~* \.(?:js|json|wasm)$ {
        expires -1;
        access_log off;
        try_files $uri =404;
    }

    # The entry point must never be cached, otherwise a release keeps serving
    # the previous build.
    location = /index.html {
        expires -1;
    }

    # Flutter web has no server side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A small health endpoint for container platforms and load balancers.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
