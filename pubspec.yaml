name: tesla_custom_wraps
description: >-
  AI-powered Tesla custom wrap designer. Describe a wrap, generate it with a
  text-to-image model, and export it in Tesla's Paint Shop format.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_saver: ^0.7.0
  http: ^1.2.2
  http_parser: ^4.0.0
  image: ^4.2.0
  shared_preferences: ^2.3.2
  # Used by the web build only: the 3D vehicle viewer and the logo picker talk
  # to the DOM directly. Conditional imports keep it out of the mobile and
  # desktop builds.
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # The 3D vehicle models are *not* bundled: the web build serves the
    # compressed copies from web/models/ (6 MB instead of 117 MB) and the
    # mobile and desktop builds have no 3D viewer. Keep the originals in
    # assets/models/ and rebuild the compressed set with
    # tool/compress_models.sh after changing them.
    # Official Tesla wrap templates and example designs.
    # Layout mirrors teslamotors/custom-wraps: <model>/template.png is the
    # paintable UV atlas, <model>/vehicle_image.png is the reference render
    # and <model>/example/*.png are Tesla's own example wraps.
    - images/
    - cybertruck/
    - cybertruck/example/
    - model3/
    - model3/example/
    - model3-2024-base/
    - model3-2024-base/example/
    - model3-2024-performance/
    - model3-2024-performance/example/
    - models-2021/
    - models-2021/example/
    - models-2025-plaid/
    - models-2025-plaid/example/
    - modelx-2021/
    - modelx-2021/example/
    - modely/
    - modely/example/
    - modely-2025-base/
    - modely-2025-base/example/
    - modely-2025-performance/
    - modely-2025-performance/example/
    - modely-2025-premium/
    - modely-2025-premium/example/
    - modely-l/
    - modely-l/example/
