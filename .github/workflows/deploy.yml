name: Deploy to GitHub Pages

# Production deployment. Enable it once in the repository settings:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# The workflow builds and verifies the Flutter web bundle and publishes it
# under https://<owner>.github.io/<repository>/. Until Pages is switched on it
# still runs the checks, keeps the bundle as an artifact and warns instead of
# failing, so merging this does not turn the pipeline red.
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 40

    outputs:
      pages: ${{ steps.pages.outputs.enabled }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # The same check the pull request runs, with the same annotations: a
      # red deploy on master must say which lint it tripped.
      - name: Static analysis
        run: |
          set +e
          flutter analyze > analyze.log 2>&1
          status=$?
          grep -E '(error|warning|info) •' analyze.log | head -60 | while IFS= read -r line; do
            echo "::error title=Static analysis::$line"
          done
          exit $status

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Build the web bundle
        run: |
          flutter build web \
            --release \
            --base-href "/${GITHUB_REPOSITORY#*/}/"
          test -f build/web/models/tesla_m3_model.glb
          test -f build/web/vendor/model-viewer.min.js

      - name: Check whether Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not enabled::Set Settings -> Pages -> Source: GitHub Actions, then re-run this workflow. The bundle is attached to this run as the web-build artifact."
          fi

      - name: Keep the bundle even when Pages is off
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 14
          if-no-files-found: error

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.pages == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
