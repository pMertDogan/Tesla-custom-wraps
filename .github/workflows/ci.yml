name: CI

# Runs on every pull request and on the branches that can be deployed, so a
# broken build never reaches a release.
on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print the toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        # The log is annotated line by line: a red X on the pull request then
        # says what broke without anyone having to open the raw log.
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.log 2>&1
          status=$?
          cat analyze.log
          grep -E '(error|warning) •' analyze.log | head -60 | while IFS= read -r line; do
            echo "::error title=Static analysis::$line"
          done
          exit $status

      - name: Unit and widget tests
        if: always()
        run: |
          set +e
          flutter test --reporter expanded > test.log 2>&1
          status=$?
          tail -n 250 test.log
          grep -E '\[E\]|Expected:|Actual:|Test failed|Exception:' test.log | head -60 |
            while IFS= read -r line; do
              echo "::error title=Test failure::$line"
            done
          exit $status

  build-web:
    name: Build the web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: analyze-and-test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build
        # The base href has to match the path the app is served from. GitHub
        # Pages serves a project site under /<repository>/, so that is the
        # default here; pass --base-href "/" for a root domain deployment.
        run: |
          flutter build web \
            --release \
            --base-href "/${GITHUB_REPOSITORY#*/}/"

      - name: Check the bundle
        run: |
          du -sh build/web
          test -f build/web/index.html
          test -f build/web/flutter_bootstrap.js
          # The 3D viewer and its decoder are static files shipped next to the
          # Flutter bundle.
          test -f build/web/vendor/model-viewer.min.js
          test -f build/web/vendor/draco/draco_decoder.wasm
          test -f build/web/models/tesla_m3_model.glb
          # The 117 MB of original GLB models stay out of the asset bundle;
          # only the compressed copies in web/models/ are deployed.
          if [ -e build/web/assets/assets/models ]; then
            echo "The uncompressed 3D models ended up in the asset bundle" >&2
            exit 1
          fi

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7
          if-no-files-found: error
